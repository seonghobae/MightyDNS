version: '3.8'

services:
  # PostgreSQL 16 with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mightydns-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mightydns
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mightydns-network

  # Valkey 7 (Redis-compatible, BSD-3-Clause licensed)
  valkey:
    image: valkey/valkey:7-alpine
    container_name: mightydns-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes --requirepass valkey_password
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mightydns-network

  # NATS JetStream
  nats:
    image: nats:latest
    container_name: mightydns-nats
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Cluster connections
    command: ["--jetstream", "--store_dir=/data", "--max_payload=8MB"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mightydns-network

  # DNS Server (build from source)
  dns_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.dns_server
    container_name: mightydns-dns-server
    ports:
      - "853:853"    # DoT
      - "53:53/udp"  # DNS UDP
      - "53:53/tcp"  # DNS TCP
      - "8443:8443"  # DoH
      - "9090:9090"  # Metrics
    environment:
      RUST_LOG: info
      MIGHTYDNS__DATABASE__URL: postgresql://mightydns_user:change-me-in-production@postgres:5432/mightydns
      MIGHTYDNS__VALKEY__URL: valkey://:valkey_password@valkey:6379
      MIGHTYDNS__NATS__URL: nats://nats:4222
      MIGHTYDNS__DNS__UPSTREAM_SERVERS: "1.1.1.1:53,8.8.8.8:53"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mightydns-network
    restart: unless-stopped

  # API Service (build from source)
  api_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.api_service
    container_name: mightydns-api-service
    ports:
      - "8080:8080"  # API
      - "9091:9091"  # Metrics
    environment:
      RUST_LOG: info
      MIGHTYDNS__DATABASE__URL: postgresql://mightydns_user:change-me-in-production@postgres:5432/mightydns
      MIGHTYDNS__VALKEY__URL: valkey://:valkey_password@valkey:6379
      MIGHTYDNS__NATS__URL: nats://nats:4222
      MIGHTYDNS__AUTH__JWT_SECRET: dev-secret-change-in-production
      MIGHTYDNS__AUTH__WEBAUTHN_RP_ID: localhost
      MIGHTYDNS__AUTH__WEBAUTHN_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mightydns-network
    restart: unless-stopped

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: mightydns-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - mightydns-network

  # Grafana (metrics visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: mightydns-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - mightydns-network

volumes:
  postgres_data:
  valkey_data:
  nats_data:
  prometheus_data:
  grafana_data:

networks:
  mightydns-network:
    driver: bridge
